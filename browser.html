<!DOCTYPE html>
<html>

<head>
    <title>Browser</title>
</head>

<body>
    <h1>Browser Details</h1>
    <h3 id="name"></h3>
    <h4 id="version"></h4>
    <script>
        function getBrowserInfo() {
            const userAgent = navigator.userAgent;
            let browserName = "Unknown";
            let browserVersion = "Unknown";

            // Detect Chrome
            if (userAgent.indexOf("Chrome") > -1 && userAgent.indexOf("Edg") === -1) {
                browserName = "Chrome";
                const match = userAgent.match(/Chrome\/(\d+\.\d+\.\d+\.\d+)/);
                if (match) {
                    browserVersion = match[1];
                }
            }
            // Detect Firefox
            else if (userAgent.indexOf("Firefox") > -1) {
                browserName = "Firefox";
                const match = userAgent.match(/Firefox\/(\d+\.\d+)/);
                if (match) {
                    browserVersion = match[1];
                }
            }
            // Detect Safari
            else if (userAgent.indexOf("Safari") > -1 && userAgent.indexOf("Chrome") === -1) {
                browserName = "Safari";
                const match = userAgent.match(/Version\/(\d+\.\d+)/);
                if (match) {
                    browserVersion = match[1];
                }
            }
            // Detect Edge (Chromium-based)
            else if (userAgent.indexOf("Edg") > -1) {
                browserName = "Edge";
                const match = userAgent.match(/Edg\/(\d+\.\d+\.\d+\.\d+)/);
                if (match) {
                    browserVersion = match[1];
                }
            }
            // Detect Internet Explorer (older versions)
            else if (userAgent.indexOf("MSIE") > -1 || userAgent.indexOf("Trident/") > -1) {
                browserName = "Internet Explorer";
                if (userAgent.indexOf("MSIE") > -1) {
                    const match = userAgent.match(/MSIE (\d+\.\d+)/);
                    if (match) {
                        browserVersion = match[1];
                    }
                } else { // IE 11 and later
                    const match = userAgent.match(/rv:(\d+\.\d+)/);
                    if (match) {
                        browserVersion = match[1];
                    }
                }
            }

            return {
                name: browserName,
                version: browserVersion
            };
        }

        const browserInfo = getBrowserInfo();
        document.getElementById('name').innerHTML = browserInfo.name;
        document.getElementById('version').innerHTML = browserInfo.version;
        console.log(`Browser Name: ${browserInfo.name}`);
        console.log(`Browser Version: ${browserInfo.version}`);

    </script>
</body>

</html>
